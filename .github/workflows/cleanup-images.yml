name: Cleanup Old Image Tags

on:
  workflow_call:
    inputs:
      images:
        description: |
          JSON array of image definitions. Each entry: {"name":"my-app"}
          (same format as build-images.yml, only "name" is used)
        type: string
        required: true
      keep:
        description: Number of recent build-number tags to keep per image
        type: number
        default: 10
      registry:
        description: Container registry host
        type: string
        default: ghcr.io
      dry-run:
        description: Log what would be deleted without actually deleting
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      images:
        description: |
          JSON array of image definitions. Each entry: {"name":"my-app"}
        type: string
        required: true
      keep:
        description: Number of recent build-number tags to keep per image
        type: number
        default: 10
      registry:
        description: Container registry host
        type: string
        default: ghcr.io
      dry-run:
        description: Log what would be deleted without actually deleting
        type: boolean
        default: false

jobs:
  cleanup:
    name: Cleanup ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(inputs.images) }}

    steps:
      - name: Prune old build-number tags
        uses: actions/github-script@v7
        env:
          IMAGE_NAME: ${{ matrix.image.name }}
          KEEP_COUNT: ${{ inputs.keep }}
          DRY_RUN: ${{ inputs.dry-run }}
        with:
          script: |
            const imageName = process.env.IMAGE_NAME;
            const keepCount = parseInt(process.env.KEEP_COUNT, 10);
            const dryRun = process.env.DRY_RUN === 'true';
            const owner = context.repo.owner;

            core.info(`Cleaning ${imageName} — keeping last ${keepCount} build tags${dryRun ? ' (DRY RUN)' : ''}`);

            // List all versions of this container package
            let versions;
            try {
              versions = await github.paginate(
                github.rest.packages.getAllPackageVersionsForPackageOwnedByUser,
                { package_type: 'container', package_name: imageName, username: owner, per_page: 100 }
              );
            } catch (err) {
              // Try org endpoint if user endpoint fails
              try {
                versions = await github.paginate(
                  github.rest.packages.getAllPackageVersionsForPackageOwnedByOrg,
                  { package_type: 'container', package_name: imageName, org: owner, per_page: 100 }
                );
              } catch {
                core.warning(`Could not list versions for ${imageName}: ${err.message}`);
                return;
              }
            }

            core.info(`Found ${versions.length} total versions`);

            // Classify versions
            const isProtectedTag = (tag) =>
              tag === 'latest' || tag === 'rollback' || /^[0-9a-f]{40}$/.test(tag);

            const numericVersions = [];
            let skippedProtected = 0;

            for (const v of versions) {
              const tags = v.metadata?.container?.tags ?? [];

              // Skip untagged versions
              if (tags.length === 0) continue;

              // If any tag is protected, skip this version entirely
              if (tags.some(isProtectedTag)) {
                // But also check if it has a numeric tag — it might be the current build
                const numTag = tags.find(t => /^\d+$/.test(t));
                if (numTag) {
                  numericVersions.push({ id: v.id, number: parseInt(numTag, 10), tags, protected: true });
                }
                skippedProtected++;
                continue;
              }

              const numTag = tags.find(t => /^\d+$/.test(t));
              if (numTag) {
                numericVersions.push({ id: v.id, number: parseInt(numTag, 10), tags, protected: false });
              }
            }

            // Sort by build number descending
            numericVersions.sort((a, b) => b.number - a.number);

            core.info(`Found ${numericVersions.length} build-number versions (${skippedProtected} with protected tags)`);

            if (numericVersions.length <= keepCount) {
              core.info(`Only ${numericVersions.length} versions — nothing to prune (keep=${keepCount})`);
              return;
            }

            const toKeep = numericVersions.slice(0, keepCount);
            const toDelete = numericVersions.slice(keepCount).filter(v => !v.protected);

            core.info(`\nKeeping: ${toKeep.map(v => v.number).join(', ')}`);
            core.info(`Deleting: ${toDelete.map(v => v.number).join(', ') || '(none — all protected)'}`);

            let deleted = 0;
            for (const v of toDelete) {
              if (dryRun) {
                core.info(`[DRY RUN] Would delete build ${v.number} (tags: ${v.tags.join(', ')})`);
              } else {
                try {
                  try {
                    await github.rest.packages.deletePackageVersionForUser({
                      package_type: 'container', package_name: imageName,
                      username: owner, package_version_id: v.id,
                    });
                  } catch {
                    await github.rest.packages.deletePackageVersionForOrg({
                      package_type: 'container', package_name: imageName,
                      org: owner, package_version_id: v.id,
                    });
                  }
                  core.info(`Deleted build ${v.number} (tags: ${v.tags.join(', ')})`);
                  deleted++;
                } catch (err) {
                  core.warning(`Failed to delete build ${v.number}: ${err.message}`);
                }
              }
            }

            core.info(`\nDone. ${dryRun ? 'Would delete' : 'Deleted'} ${dryRun ? toDelete.length : deleted} of ${numericVersions.length} build versions.`);
