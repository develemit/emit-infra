name: Build & Push Images

on:
  workflow_call:
    inputs:
      images:
        description: |
          JSON array of image definitions. Each entry: {"name":"my-app","dockerfile":"apps/my-app/Dockerfile"}
        type: string
        required: true
      registry:
        description: Container registry host
        type: string
        default: ghcr.io
      context:
        description: Docker build context path
        type: string
        default: "."
    secrets:
      REGISTRY_TOKEN:
        description: Token for registry auth (defaults to GITHUB_TOKEN for ghcr.io)
        required: false

jobs:
  build:
    name: Build ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(inputs.images) }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Compute next build number
        id: build_number
        run: |
          IMAGE_NAME="${{ matrix.image.name }}"
          git fetch --tags --force
          LAST=$(git tag -l "build/${IMAGE_NAME}/*" \
            | sed "s|build/${IMAGE_NAME}/||" \
            | sort -n \
            | tail -1)
          LAST=${LAST:-0}
          NEXT=$((LAST + 1))
          echo "number=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "Build number for ${IMAGE_NAME}: ${NEXT} (previous: ${LAST})"

      - name: Build and push ${{ matrix.image.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ matrix.image.dockerfile }}
          push: true
          build-args: ${{ matrix.image.build_args || '' }}
          tags: |
            ${{ inputs.registry }}/${{ github.repository_owner }}/${{ matrix.image.name }}:latest
            ${{ inputs.registry }}/${{ github.repository_owner }}/${{ matrix.image.name }}:${{ github.sha }}
            ${{ inputs.registry }}/${{ github.repository_owner }}/${{ matrix.image.name }}:${{ steps.build_number.outputs.number }}
          labels: |
            build.number=${{ steps.build_number.outputs.number }}
            build.sha=${{ github.sha }}
            build.repo=${{ github.repository }}
            build.date=${{ steps.build_number.outputs.date }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,scope=${{ matrix.image.name }},mode=max

      - name: Push build number git tag
        run: |
          IMAGE_NAME="${{ matrix.image.name }}"
          BUILD_NUM="${{ steps.build_number.outputs.number }}"
          TAG="build/${IMAGE_NAME}/${BUILD_NUM}"
          git tag "${TAG}"
          if ! git push origin "${TAG}" 2>&1; then
            echo "::error::Failed to push tag ${TAG}. A concurrent build may have claimed this number. Re-run the workflow to pick up the next number."
            exit 1
          fi
