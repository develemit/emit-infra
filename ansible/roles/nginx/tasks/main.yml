---
- name: Install nginx and certbot
  apt:
    name:
      - nginx
      - certbot
      - python3-certbot-nginx
    state: present
    update_cache: true

- name: Install certbot Cloudflare DNS plugin (wildcard certs)
  apt:
    name: python3-certbot-dns-cloudflare
    state: present
  when: nginx_wildcard_cert | default(false)

- name: Start and enable nginx
  service:
    name: nginx
    state: started
    enabled: true

- name: Copy custom nginx site config
  copy:
    src: "{{ nginx_custom_config_src }}"
    dest: "/etc/nginx/sites-available/{{ project_name }}"
    owner: root
    group: root
    mode: "0644"
  when: nginx_custom_config_src is defined
  notify: reload nginx

- name: Write nginx site config from template
  template:
    src: "{{ 'upstream-site.conf.j2' if blue_green | default(false) else 'site.conf.j2' }}"
    dest: "/etc/nginx/sites-available/{{ project_name }}"
    owner: root
    group: root
    mode: "0644"
  when: nginx_custom_config_src is not defined
  notify: reload nginx

- name: Enable nginx site
  file:
    src: "/etc/nginx/sites-available/{{ project_name }}"
    dest: "/etc/nginx/sites-enabled/{{ project_name }}"
    state: link
  notify: reload nginx

- name: Remove nginx default site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: reload nginx

- name: Ensure Cloudflare credentials dir exists
  file:
    path: /etc/letsencrypt/cloudflare
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: nginx_wildcard_cert | default(false)

- name: Write Cloudflare credentials for certbot DNS-01
  copy:
    content: "dns_cloudflare_api_token = {{ cloudflare_api_token }}\n"
    dest: /etc/letsencrypt/cloudflare/credentials.ini
    owner: root
    group: root
    mode: "0600"
  when: nginx_wildcard_cert | default(false)

- name: Obtain wildcard SSL certificate (DNS-01)
  command: >
    certbot certonly --dns-cloudflare
    --dns-cloudflare-credentials /etc/letsencrypt/cloudflare/credentials.ini
    --non-interactive
    --agree-tos
    --email {{ certbot_email }}
    -d {{ domain }}
    -d *.{{ domain }}
  args:
    creates: "/etc/letsencrypt/live/{{ domain }}/fullchain.pem"
  when: nginx_wildcard_cert | default(false)

- name: Obtain standard SSL certificate (HTTP-01)
  command: >
    certbot --nginx
    --non-interactive
    --agree-tos
    --email {{ certbot_email }}
    -d {{ domain }}
    {% if nginx_www | default(true) %}-d www.{{ domain }}{% endif %}
  args:
    creates: "/etc/letsencrypt/live/{{ domain }}/fullchain.pem"
  when: not (nginx_wildcard_cert | default(false))

- name: Create /etc/nginx/blue-green/ directory for slot include files
  file:
    path: /etc/nginx/blue-green
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: blue_green | default(false)

- name: Write initial blue-green slot config (blue slot)
  template:
    src: blue-green-slot.conf.j2
    dest: "/etc/nginx/blue-green/{{ project_name }}.conf"
    owner: root
    group: root
    mode: "0644"
  vars:
    slot: blue
    web_port: "{{ blue_web_port | default(4300) }}"
    api_port: "{{ blue_api_port | default(4301) }}"
    worker_port: "{{ blue_worker_port | default(4302) }}"
    marketing_port: "{{ blue_marketing_port | default(4303) }}"
  when: blue_green | default(false)
  notify: reload nginx

- name: Set up certbot auto-renewal
  cron:
    name: certbot-renew
    job: "certbot renew --quiet"
    hour: "3"
    minute: "30"
    weekday: "1"
