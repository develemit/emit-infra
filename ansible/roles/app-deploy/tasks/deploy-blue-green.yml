---
- name: Generate .deploy-config from Ansible vars
  copy:
    content: |
      SERVICES="{{ bg_services | default('web api worker marketing') }}"
      PORTS_BLUE="{{ bg_ports_blue | default('4300 4301 4302 4303') }}"
      PORTS_GREEN="{{ bg_ports_green | default('4400 4401 4402 4403') }}"
      HEALTH_CHECKS="{{ bg_health_checks | default('/ /readyz skip skip') }}"
      HEALTH_RETRIES=20
      HEALTH_INTERVAL=5
      COMPOSE_STRUCTURE="{{ bg_compose_structure | default('separate') }}"
      COMPOSE_APP="{{ app_dir }}/docker-compose.app.yml"
      COMPOSE_FILE="{{ app_dir }}/{{ compose_dest | default('docker-compose.prod.yml') }}"
      NGINX_CONF_PATH="{{ bg_nginx_conf_path | default('/etc/nginx/blue-green/' + project_name + '.conf') }}"
      MIGRATE_PRE="{{ bg_migrate_pre | default('') }}"
      MIGRATE_POST="{{ bg_migrate_post | default('') }}"
      POST_EXEC="{{ bg_post_exec | default('') }}"
      # 'standard' (image prune -f) is a no-op here: every image keeps its
      # :SHA/:BUILD_NUMBER tags so none is ever dangling — tastease hit 69%
      # disk from 179 accumulated tags. Override via blueGreen.pruneStrategy.
      PRUNE_STRATEGY="{{ bg_prune_strategy | default('aggressive') }}"
      SLOT_GRACE_SECONDS=0
    dest: "{{ app_dir }}/.deploy-config"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"

- name: Compute ephemeral GHCR docker config path
  set_fact:
    ghcr_config_dir: "/root/.docker-ghcr-{{ project_name }}"

# The login writes to a per-deploy config dir instead of the default
# /root/.docker/config.json so no credential is left at rest once the deploy
# finishes — success or failure. block/always (not a trailing logout task)
# so a deploy that dies mid-pull still cleans up.
- block:
    - name: Create ephemeral GHCR docker config directory
      file:
        path: "{{ ghcr_config_dir }}"
        state: directory
        mode: "0700"
      when: ghcr_token is defined

    - name: Login to GHCR
      shell: echo "{{ ghcr_token }}" | docker --config "{{ ghcr_config_dir }}" login ghcr.io -u "{{ ghcr_actor }}" --password-stdin
      when: ghcr_token is defined
      no_log: true

    - name: Run blue-green deploy script
      command: bash {{ app_dir }}/blue-green-deploy.sh {{ project_name }}
      # Each Ansible task is a separate process, so DOCKER_CONFIG must be set
      # here (where the script that does the actual `pull` runs), not in the
      # login task above. Only set it when we logged in somewhere non-default
      # — an unset DOCKER_CONFIG lets the no-token path keep using the
      # server's existing persistent credential until sprint 320 removes it.
      environment: "{{ {'DOCKER_CONFIG': ghcr_config_dir} if ghcr_token is defined else {} }}"
      register: bg_deploy_result
  always:
    - name: Remove ephemeral GHCR docker config directory
      file:
        path: "{{ ghcr_config_dir }}"
        state: absent
      when: ghcr_token is defined

- name: Show deploy output
  debug:
    msg: "{{ bg_deploy_result.stdout_lines }}"
