---
# ── Setup ────────────────────────────────────────────────────────
- name: Create app directory
  file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Copy docker-compose file
  copy:
    src: "{{ compose_src | default('docker-compose.yml') }}"
    dest: "{{ app_dir }}/{{ compose_dest | default('docker-compose.yml') }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"

- name: Copy extra files
  copy:
    src: "{{ item.src }}"
    dest: "{{ app_dir }}/{{ item.dest }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  loop: "{{ extra_files | default([]) }}"

- name: Copy .env file
  copy:
    src: "{{ env_src | default('.env') }}"
    dest: "{{ app_dir }}/.env"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  when: copy_env | default(false)

- name: Copy health-check script
  copy:
    src: health-check.sh
    dest: "{{ app_dir }}/health-check.sh"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

# ── Deploy strategy ──────────────────────────────────────────────
- name: Deploy (zero-downtime)
  include_tasks: deploy-zero-downtime.yml
  when: zero_downtime | default(false)

- name: Deploy (standard)
  include_tasks: deploy-standard.yml
  when: not (zero_downtime | default(false))

# ── Post-deploy ──────────────────────────────────────────────────
- name: Read deployed build number from container label
  shell: >
    docker inspect --format '{{"{{"}}index .Config.Labels "build.number"{{"}}"}}' \
      $(docker compose -f {{ compose_dest | default('docker-compose.yml') }} ps -q | head -1) 2>/dev/null || echo ""
  args:
    chdir: "{{ app_dir }}"
  register: deployed_build_number
  changed_when: false
  ignore_errors: true

- name: Write deployed version file
  copy:
    content: "{{ deployed_build_number.stdout | trim }}"
    dest: "{{ app_dir }}/.deployed-version"
    mode: "0644"
  when: deployed_build_number.stdout | default('') | trim | length > 0

- name: Run post-deploy commands
  command: docker compose -f {{ compose_dest | default('docker-compose.yml') }} exec -T {{ item.service }} {{ item.command }}
  args:
    chdir: "{{ app_dir }}"
  loop: "{{ post_deploy_exec | default([]) }}"
  retries: 5
  delay: 3
  register: post_deploy_result
  until: post_deploy_result is succeeded

- name: Remove dangling images
  command: docker image prune -f
