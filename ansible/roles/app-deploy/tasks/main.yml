---
# ── Setup ────────────────────────────────────────────────────────
- name: Create app directory
  file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Copy docker-compose file
  copy:
    src: "{{ compose_src | default('docker-compose.yml') }}"
    dest: "{{ app_dir }}/{{ compose_dest | default('docker-compose.yml') }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"

- name: Copy extra files
  copy:
    src: "{{ item.src }}"
    dest: "{{ app_dir }}/{{ item.dest }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  loop: "{{ extra_files | default([]) }}"

- name: Copy .env file
  copy:
    src: "{{ env_src | default('.env') }}"
    dest: "{{ app_dir }}/.env"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  when: copy_env | default(false)

- name: Set BUILD_NUMBER in server .env
  lineinfile:
    path: "{{ app_dir }}/.env"
    regexp: "^BUILD_NUMBER="
    line: "BUILD_NUMBER={{ build_number }}"
    create: false
  when: build_number is defined

- name: Copy health-check script
  copy:
    src: health-check.sh
    dest: "{{ app_dir }}/health-check.sh"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Copy blue-green deploy script
  copy:
    src: blue-green-deploy.sh
    dest: "{{ app_dir }}/blue-green-deploy.sh"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  when: blue_green | default(false)

- name: Copy health-check-all script
  copy:
    src: health-check-all.sh
    dest: "{{ app_dir }}/health-check-all.sh"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  when: blue_green | default(false)

- name: Copy blue-green compose files
  copy:
    src: "{{ item }}"
    dest: "{{ app_dir }}/{{ item | basename }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  loop: "{{ blue_green_compose_files | default([]) }}"
  when: blue_green | default(false)

- name: Start infra stack
  command: docker compose -f {{ compose_dest | default('docker-compose.prod.yml') }} up -d
  args:
    chdir: "{{ app_dir }}"
  when: blue_green | default(false)

- name: Initialise active slot to blue
  copy:
    content: "blue"
    dest: "{{ app_dir }}/.active-slot"
    force: false
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  when: blue_green | default(false)

# ── Deploy strategy ──────────────────────────────────────────────
- name: Deploy (blue-green)
  include_tasks: deploy-blue-green.yml
  when: blue_green | default(false)

- name: Deploy (zero-downtime)
  include_tasks: deploy-zero-downtime.yml
  when: not (blue_green | default(false)) and (zero_downtime | default(false))

- name: Deploy (standard)
  include_tasks: deploy-standard.yml
  when: not (blue_green | default(false)) and not (zero_downtime | default(false))

# ── Post-deploy ──────────────────────────────────────────────────
- name: Read deployed build number from container label
  shell: >
    docker inspect --format '{{"{{"}}index .Config.Labels "build.number"{{"}}"}}' \
      $(docker compose -f {{ compose_dest | default('docker-compose.yml') }} ps -q | head -1) 2>/dev/null || echo ""
  args:
    chdir: "{{ app_dir }}"
  register: deployed_build_number
  changed_when: false
  ignore_errors: true
  when: build_number is not defined

- name: Write deployed version file
  copy:
    content: "{{ build_number | default(deployed_build_number.stdout | default('') | trim, true) }}"
    dest: "{{ app_dir }}/.deployed-version"
    mode: "0644"
  when: build_number is defined or (deployed_build_number.stdout | default('') | trim | length > 0)

- name: Run post-deploy commands
  command: docker compose -f {{ compose_dest | default('docker-compose.yml') }} exec -T {{ item.service }} {{ item.command }}
  args:
    chdir: "{{ app_dir }}"
  loop: "{{ post_deploy_exec | default([]) }}"
  retries: 5
  delay: 3
  register: post_deploy_result
  until: post_deploy_result is succeeded

- name: Remove dangling images
  command: docker image prune -f
