---
# Standard deploy: pull → up → health check with rollback support.

# ── Snapshot current images for rollback ──────────────────────────
- name: Get current image list
  shell: docker compose -f {{ compose_dest | default('docker-compose.yml') }} config --images 2>/dev/null || true
  args:
    chdir: "{{ app_dir }}"
  register: current_images
  when: rollback_enabled | default(true)

- name: Tag current images with timestamp and :rollback alias
  shell: |
    TS=$(date -u +%Y%m%dT%H%M%S)
    IMAGE_BASE="{{ item.split(':')[0] }}"
    docker tag "{{ item }}:latest" "${IMAGE_BASE}:rollback-${TS}" 2>/dev/null || \
    docker tag "{{ item }}" "${IMAGE_BASE}:rollback-${TS}" 2>/dev/null || true
    docker tag "${IMAGE_BASE}:rollback-${TS}" "${IMAGE_BASE}:rollback" 2>/dev/null || true
    docker images --format "{{ '{{' }}.Tag{{ '}}' }}" "${IMAGE_BASE}" | grep "^rollback-" | sort | head -n -3 | \
      xargs -I{} docker rmi "${IMAGE_BASE}:{}" 2>/dev/null || true
  loop: "{{ current_images.stdout_lines | default([]) }}"
  when: rollback_enabled | default(true)

# ── Pull and deploy ──────────────────────────────────────────────
- name: Login to GHCR
  shell: echo "{{ ghcr_token }}" | docker login ghcr.io -u "{{ ghcr_actor }}" --password-stdin
  when: ghcr_token is defined
  no_log: true

- name: Pull latest images
  command: docker compose -f {{ compose_dest | default('docker-compose.yml') }} pull
  args:
    chdir: "{{ app_dir }}"

- name: Start or restart app stack
  command: docker compose -f {{ compose_dest | default('docker-compose.yml') }} up -d --remove-orphans
  args:
    chdir: "{{ app_dir }}"

# ── Health check with rollback on failure ────────────────────────
- name: Health check and rollback
  when: rollback_enabled | default(true)
  block:
    - name: Verify app is serving traffic (url)
      command: >-
        curl -sf --max-time 5 --retry {{ health_check_retries | default(10) }}
        --retry-delay {{ health_check_backoff | default(3) }}
        --retry-connrefused "{{ health_check_url }}"
      when: health_check_url is defined

    - name: Verify app is serving traffic (port)
      command: "{{ app_dir }}/health-check.sh {{ app_port | default(3000) }} {{ health_check_retries | default(10) }} {{ health_check_path | default('/') }} {{ health_check_backoff | default(3) }}"
      when: health_check_url is not defined

  rescue:
    - name: "ROLLBACK: Restore previous images"
      shell: |
        docker tag "{{ item.split(':')[0] }}:rollback" "{{ item.split(':')[0] }}:latest" 2>/dev/null || true
      loop: "{{ current_images.stdout_lines | default([]) }}"

    - name: "ROLLBACK: Restart app stack with previous images"
      command: docker compose -f {{ compose_dest | default('docker-compose.yml') }} up -d --remove-orphans
      args:
        chdir: "{{ app_dir }}"

    - name: "ROLLBACK: Verify rollback is serving traffic (url)"
      command: >-
        curl -sf --max-time 5 --retry {{ health_check_retries | default(10) }}
        --retry-delay {{ health_check_backoff | default(3) }}
        --retry-connrefused "{{ health_check_url }}"
      when: health_check_url is defined

    - name: "ROLLBACK: Verify rollback is serving traffic (port)"
      command: "{{ app_dir }}/health-check.sh {{ app_port | default(3000) }} {{ health_check_retries | default(10) }} {{ health_check_path | default('/') }} {{ health_check_backoff | default(3) }}"
      when: health_check_url is not defined

    - name: "ROLLBACK: Fail with descriptive message"
      fail:
        msg: "Deploy failed, rolled back to previous image. The previous version is now serving traffic."

- name: Verify app is serving traffic (without rollback, url)
  command: >-
    curl -sf --max-time 5 --retry {{ health_check_retries | default(10) }}
    --retry-delay {{ health_check_backoff | default(3) }}
    --retry-connrefused "{{ health_check_url }}"
  when: not (rollback_enabled | default(true)) and health_check_url is defined

- name: Verify app is serving traffic (without rollback, port)
  command: "{{ app_dir }}/health-check.sh {{ app_port | default(3000) }} {{ health_check_retries | default(10) }} {{ health_check_path | default('/') }} {{ health_check_backoff | default(3) }}"
  when: not (rollback_enabled | default(true)) and health_check_url is not defined

- name: Prune old Docker images and stopped containers
  shell: |
    docker container prune -f --filter "until=24h"
    docker image prune -a -f --filter "until=24h"
  ignore_errors: true
  changed_when: false

- name: Record deploy timestamp
  shell: "date +%s > /opt/{{ project_name }}/.deployed-at"
  changed_when: false
